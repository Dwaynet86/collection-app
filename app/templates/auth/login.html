{% extends "base.html" %}
{% from "_macros.html" import csrf_field %}
{% block title %}Sign in · Collection{% endblock %}
{% block content %}
<form class="form form-narrow" method="post">
  {{ csrf_field() }}
  <h1>Sign in</h1>
  {% if error %}<p class="field-error" role="alert">{{ error }}</p>{% endif %}

  <label for="username">Username</label>
  <input id="username" name="username" type="text" value="{{ username }}" autocomplete="username" autocapitalize="none" required autofocus>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>

  <label class="check"><input type="checkbox" name="remember" value="1"> Keep me signed in on this device</label>

  <div class="actions"><button class="btn btn-primary" type="submit">Sign in</button></div>
</form>
{% endblock %}
